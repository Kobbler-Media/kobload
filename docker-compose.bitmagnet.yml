# Overlay: adds bitmagnet, a local DHT torrent index Kobload can sync from
# (see api/src/jobs/handlers/bitmagnet_sync.rs). Not required to run Kobload.
#
#   docker compose -f docker-compose.yml -f docker-compose.bitmagnet.yml up -d --build
#
# Also re-tunes Postgres autovacuum for bitmagnet's DHT crawl tables; see
# docker/postgres-tuning.conf for the rationale behind each value. The core
# stack's db service runs with stock Postgres defaults without this overlay.

services:
  db:
    volumes:
      - ./docker/init-bitmagnet-db.sh:/docker-entrypoint-initdb.d/init-bitmagnet-db.sh
    command:
      - postgres
      - -c
      - autovacuum_vacuum_scale_factor=0.02
      - -c
      - autovacuum_vacuum_threshold=5000
      - -c
      - autovacuum_vacuum_insert_scale_factor=0.02
      - -c
      - autovacuum_work_mem=1GB
      - -c
      - maintenance_work_mem=2GB
      - -c
      - autovacuum_vacuum_cost_delay=2ms
      - -c
      - autovacuum_vacuum_cost_limit=2000
      - -c
      - autovacuum_max_workers=4
      - -c
      - autovacuum_naptime=30s
      - -c
      - log_autovacuum_min_duration=60s
      # Memory sizing depends on the host, so it comes from .env; the defaults
      # are stock Postgres. See docker/postgres-tuning.conf.
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-128MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-4GB}
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-1GB}

  bitmagnet:
    image: ghcr.io/bitmagnet-io/bitmagnet:v0.10.1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_NAME=bitmagnet
      - POSTGRES_USER=kobload
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kobload}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - DHT_SCALING_FACTOR=10
    command: ["worker", "run", "--all"]
    volumes:
      - ./docker/classifier.yml:/classifier.yml:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BITMAGNET_WEB_PORT:-3333}:3333"
      - "${BITMAGNET_DHT_PORT:-3334}:3334/udp"
