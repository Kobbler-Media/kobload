# NPM terminates TLS, so $scheme is always http here; the API decides Secure cookies from this.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

map $sent_http_content_type $html_cache_control {
  ~^text/html "no-cache";
}

server {
  listen 80;
  http2 on;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css text/plain text/xml application/javascript application/json application/manifest+json application/wasm image/svg+xml;

  # Re-resolve upstream hostnames so an api restart (new container IP) doesn't
  # strand nginx with a stale cached IP. Pair with $upstream variables in
  # proxy_pass below — without the variable, nginx resolves once at startup.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Health check endpoint for Calibre plugin
  location = /health {
    set $api_upstream "api:7080";
    proxy_pass http://$api_upstream/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Proxy API requests to the api container
  location /api/ {
    set $api_upstream "api:7080";
    proxy_pass http://$api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # WebSocket support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeouts for long-polling/streaming
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    # No body size limit — file downloads are streamed
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
  }

  location /_app/immutable/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    add_header Cache-Control $html_cache_control;
    try_files $uri /index.html;
  }
}
