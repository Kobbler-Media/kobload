server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Re-resolve upstream hostnames so an api restart (new container IP) doesn't
  # strand nginx with a stale cached IP. Pair with $upstream variables in
  # proxy_pass below — without the variable, nginx resolves once at startup.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Health check endpoint for Calibre plugin
  location = /health {
    set $api_upstream "api:7080";
    proxy_pass http://$api_upstream/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Proxy API requests to the api container
  location /api/ {
    set $api_upstream "api:7080";
    proxy_pass http://$api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeouts for long-polling/streaming
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    # No body size limit — file downloads are streamed
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
  }

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }
}
