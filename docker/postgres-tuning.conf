# Reference for the autovacuum settings passed to the db service as `-c` flags
# in docker-compose.yml. This file is NOT mounted or read by Postgres: the
# official image has no conf.d include wired up, and `include=` is only valid
# inside a config file, not as a `-c` flag (it fails with "unrecognized
# configuration parameter"). Keep this file in sync with the compose command.
#
# Why these values:
#
# The bitmagnet DHT crawl tables ran on stock settings and torrent_files
# reached ~3.6M dead rows against 3.7M live -- roughly half the table -- with
# last_autovacuum still NULL. Two defaults caused that:
#
#   * autovacuum_vacuum_scale_factor = 0.2 waits for 20% of the table to go
#     dead before collecting, i.e. ~750K dead rows on torrent_files.
#   * maintenance_work_mem = 64MB is far too small to hold the index-vacuum
#     state for that table's 38GB of indexes, so each pass that did start was
#     starved out by the crawler's constant write load.

autovacuum_vacuum_scale_factor = 0.02    # collect at 2% dead, not 20%
autovacuum_vacuum_threshold = 5000
autovacuum_vacuum_insert_scale_factor = 0.02

autovacuum_work_mem = 1GB                # enough for the large indexes
maintenance_work_mem = 2GB

autovacuum_vacuum_cost_delay = 2ms       # stock limits throttle to a crawl
autovacuum_vacuum_cost_limit = 2000

autovacuum_max_workers = 4               # keep small tables off the big queue
autovacuum_naptime = 30s

log_autovacuum_min_duration = 60s        # surface slow runs before they bloat
